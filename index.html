<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Highway Racing | Developed by Vivek</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        body { background: #050814; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        .header { text-align: center; margin-bottom: 10px; }
        .header h1 { font-size: 24px; color: #00f3ff; text-shadow: 0 0 12px #00f3ff; letter-spacing: 1px; }
        .header p { font-size: 12px; color: #facc15; font-weight: bold; }
        .hud { display: flex; justify-content: space-between; width: 360px; max-width: 95vw; background: #0f172a; padding: 10px 16px; border-radius: 10px 10px 0 0; border: 2px solid #00f3ff; border-bottom: none; font-size: 14px; font-weight: bold; }
        .hud span { color: #38bdf8; }
        #nitroText { color: #facc15; }
        .game-wrap { position: relative; width: 360px; max-width: 95vw; height: 500px; border: 2px solid #00f3ff; box-shadow: 0 0 25px rgba(0, 243, 255, 0.35); background: #0b1021; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; }
        .overlay { position: absolute; inset: 0; background: rgba(5, 8, 20, 0.88); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
        .overlay h2 { font-size: 28px; color: #ff007f; text-shadow: 0 0 15px #ff007f; margin-bottom: 10px; }
        .overlay p { font-size: 14px; color: #cbd5e1; margin-bottom: 20px; line-height: 1.5; }
        .btn { background: linear-gradient(90deg, #00f3ff, #0284c7); color: #050814; border: none; padding: 12px 28px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; box-shadow: 0 0 15px #00f3ff; }
        .controls { display: flex; gap: 10px; width: 360px; max-width: 95vw; margin-top: 10px; }
        .ctrl-btn { flex: 1; padding: 14px; background: #1e293b; color: #00f3ff; border: 1px solid #00f3ff; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .nitro-btn { background: #422006; color: #facc15; border-color: #facc15; }
    </style>
</head>
<body>

<div class="header">
    <h1>🏎️ NEON HIGHWAY RACING</h1>
    <p>Developed by Vivek | A.S.M Convent School</p>
</div>

<div class="hud">
    <div>SCORE: <span id="score">0</span></div>
    <div>BEST: <span id="best">0</span></div>
    <div id="nitroText">⚡ NITRO: READY</div>
</div>

<div class="game-wrap">
    <canvas id="gameCanvas" width="360" height="500"></canvas>
    <div class="overlay" id="overlay">
        <h2 id="overTitle">NEON HIGHWAY</h2>
        <p id="overMsg">Desktop: Use ⬅️ ➡️ Arrow Keys & SPACE for Nitro<br>Mobile: Use Buttons Below</p>
        <button class="btn" onclick="startGame()">START RACE 🚀</button>
    </div>
</div>

<div class="controls">
    <button class="ctrl-btn" onmousedown="moveLeft()" ontouchstart="moveLeft()">⬅️ LEFT</button>
    <button class="ctrl-btn nitro-btn" onmousedown="activateNitro()" ontouchstart="activateNitro()">🔥 NITRO</button>
    <button class="ctrl-btn" onmousedown="moveRight()" ontouchstart="moveRight()">RIGHT ➡️</button>
</div>
<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    let score = 0, best = localStorage.getItem("vivekRaceBest") || 0;
    document.getElementById("best").innerText = best;

    let playing = false, speed = 5, nitro = false, nitroTimer = 0, roadOffset = 0;
    const lanes = new Array(35, 155, 275);
    let playerLane = 1;
    let enemies = new Array(), coins = new Array();

    function startGame() {
        score = 0; speed = 5; playerLane = 1; enemies = new Array(); coins = new Array();
        nitro = false; nitroTimer = 0; playing = true;
        document.getElementById("overlay").style.display = "none";
        loop();
    }

    function moveLeft() { if (playing && playerLane > 0) playerLane--; }
    function moveRight() { if (playing && playerLane < 2) playerLane++; }
    function activateNitro() {
        if (playing && !nitro && nitroTimer <= 0) {
            nitro = true; nitroTimer = 180;
        }
    }

    document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft") moveLeft();
        if (e.key === "ArrowRight") moveRight();
        if (e.key === " ") activateNitro();
    });

    function drawCar(x, y, color, glow, isPlayer) {
        ctx.save();
        ctx.shadowBlur = 15; ctx.shadowColor = glow;
        ctx.fillStyle = color;
        ctx.beginPath(); ctx.roundRect(x, y, 50, 85, 10); ctx.fill();
        ctx.fillStyle = "#050814";
        ctx.fillRect(x + 8, y + (isPlayer ? 18 : 48), 34, 20);
        if (isPlayer && nitro) {
            ctx.fillStyle = "#facc15";
            ctx.beginPath(); ctx.arc(x + 15, y + 92, 7, 0, Math.PI * 2); ctx.arc(x + 35, y + 92, 7, 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();
    }

    function loop() {
        if (!playing) return;
        ctx.clearRect(0, 0, 360, 500);

        let curSpeed = nitro ? speed * 1.8 : speed;
        if (nitro) {
            nitroTimer--;
            document.getElementById("nitroText").innerText = "🔥 NITRO ON!";
            if (nitroTimer <= 0) nitro = false;
        } else {
            document.getElementById("nitroText").innerText = "⚡ NITRO: READY";
        }

        roadOffset = (roadOffset + curSpeed) % 40;
        ctx.strokeStyle = "#1e293b"; ctx.lineWidth = 4; ctx.setLineDash(new Array(20, 20));
        ctx.lineDashOffset = -roadOffset;
        ctx.beginPath(); ctx.moveTo(120, 0); ctx.lineTo(120, 500); ctx.moveTo(240, 0); ctx.lineTo(240, 500); ctx.stroke();
        ctx.setLineDash(new Array());

        let px = lanes[playerLane], py = 390;
        drawCar(px, py, "#00f3ff", "#00f3ff", true);

        if (Math.random() < 0.025) {
            let l = Math.floor(Math.random() * 3);
            if (!enemies.some(en => en.y < 140)) enemies.push({ lane: l, y: -90 });
        }
        if (Math.random() < 0.02) {
            let l = Math.floor(Math.random() * 3);
            coins.push({ lane: l, y: -30 });
        }

        for (let i = enemies.length - 1; i >= 0; i--) {
            let en = enemies[i]; en.y += curSpeed;
            let ex = lanes[en.lane];
            drawCar(ex, en.y, "#ff007f", "#ff007f", false);
            if (en.lane === playerLane && en.y + 80 > py && en.y < py + 80) {
                playing = false;
                if (score > best) { best = score; localStorage.setItem("vivekRaceBest", best); document.getElementById("best").innerText = best; }
                document.getElementById("overTitle").innerText = "💥 CRASHED!";
                document.getElementById("overMsg").innerText = "Final Score: " + score + " | Best: " + best;
                document.getElementById("overlay").style.display = "flex";
                return;
            }
            if (en.y > 520) { enemies.splice(i, 1); score += 10; speed += 0.05; }
        }

        for (let i = coins.length - 1; i >= 0; i--) {
            let c = coins[i]; c.y += curSpeed;
            let cx = lanes[c.lane] + 25;
            ctx.fillStyle = "#facc15"; ctx.beginPath(); ctx.arc(cx, c.y, 12, 0, Math.PI * 2); ctx.fill();
            if (c.lane === playerLane && c.y + 12 > py && c.y - 12 < py + 85) {
                score += 25; coins.splice(i, 1);
            } else if (c.y > 520) coins.splice(i, 1);
        }

        document.getElementById("score").innerText = score;
        requestAnimationFrame(loop);
    }
</script>
</body>
</html>
